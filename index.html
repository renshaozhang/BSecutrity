<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>B证项目负责人题库 - 做题练习</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-dark: #4338ca;
            --correct: #10b981;
            --correct-bg: #d1fae5;
            --wrong: #ef4444;
            --wrong-bg: #fee2e2;
            --muted: #6b7280;
            --bg: #f3f4f6;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-secondary: #4b5563;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        /* Top bar */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: var(--primary);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(79,70,229,.25);
        }
        .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .topbar-title { font-size: 17px; font-weight: 600; }
        .topbar-stats { font-size: 13px; opacity: .92; white-space: nowrap; }
        .topbar-stats b { font-weight: 600; }
        .icon-btn {
            background: rgba(255,255,255,.18);
            border: none; color: #fff;
            width: 38px; height: 38px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; transition: background .15s;
        }
        .icon-btn:hover, .icon-btn:active { background: rgba(255,255,255,.3); }
        /* Progress */
        .progress-wrap { margin-top: 10px; }
        .progress-bar { height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #fff; border-radius: 3px; transition: width .3s ease; width: 0; }
        .progress-text { font-size: 12px; opacity: .9; margin-top: 4px; display: flex; justify-content: space-between; }

        /* Main */
        .main { max-width: 760px; margin: 0 auto; padding: 16px 14px 100px; }

        /* Question card */
        .q-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .q-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #eef2ff; color: var(--primary-dark);
            padding: 4px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .q-type-tag {
            font-size: 11px; color: var(--muted);
            background: #f3f4f6; padding: 3px 9px; border-radius: 10px;
        }
        .q-text {
            font-size: 17px; line-height: 1.7; color: var(--text);
            margin-bottom: 18px; word-break: break-word;
        }
        .q-text .blank { color: var(--primary); font-weight: 600; letter-spacing: 2px; }

        /* Options */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex; align-items: flex-start; gap: 12px;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px 14px;
            cursor: pointer;
            transition: all .18s ease;
            text-align: left;
            font-size: 16px;
            line-height: 1.55;
            color: var(--text);
            min-height: 52px;
            font-family: inherit;
        }
        .option:hover:not(.disabled) { border-color: var(--primary-light); background: #eef2ff; }
        .option:active:not(.disabled) { transform: scale(.99); }
        .option .letter {
            flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            background: #f3f4f6; color: var(--text-secondary);
            font-weight: 700; font-size: 14px;
            margin-top: 1px;
        }
        .option .opt-text { flex: 1; }
        .option.disabled { cursor: default; }
        .option.selected { border-color: var(--primary); background: #eef2ff; }
        .option.selected .letter { background: var(--primary); color: #fff; }
        .option.correct { border-color: var(--correct); background: var(--correct-bg); }
        .option.correct .letter { background: var(--correct); color: #fff; }
        .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
        .option.wrong .letter { background: var(--wrong); color: #fff; }
        .option.correct .opt-text, .option.wrong .opt-text { font-weight: 500; }

        /* Feedback panel */
        .feedback {
            border-radius: var(--radius);
            padding: 16px;
            margin-top: 14px;
            display: none;
            animation: slideUp .25s ease;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: var(--correct-bg); border: 1px solid #a7f3d0; }
        .feedback.wrong { background: var(--wrong-bg); border: 1px solid #fecaca; }
        .feedback-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; margin-bottom: 8px; }
        .feedback.correct .feedback-head { color: #065f46; }
        .feedback.wrong .feedback-head { color: #991b1b; }
        .feedback-body { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
        .feedback-body .row { display: flex; gap: 6px; margin-bottom: 4px; }
        .feedback-body .label { color: var(--muted); flex-shrink: 0; }
        .feedback-body .ans-letter { font-weight: 700; }
        .feedback-body .ans-correct { color: var(--correct); font-weight: 700; }
        .feedback-body .ans-wrong { color: var(--wrong); font-weight: 700; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Bottom nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            display: flex; gap: 10px; align-items: center;
            box-shadow: 0 -2px 12px rgba(0,0,0,.06);
        }
        .bottom-nav .nav-btn {
            flex: 1;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: #fff; color: var(--primary-dark);
            border: 1.5px solid var(--primary);
            border-radius: 10px;
            padding: 11px 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all .15s;
            font-family: inherit;
            min-height: 44px;
        }
        .bottom-nav .nav-btn:hover { background: var(--primary); color: #fff; }
        .bottom-nav .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
        .bottom-nav .nav-btn.primary { background: var(--primary); color: #fff; }
        .bottom-nav .nav-btn.primary:hover { background: var(--primary-dark); }
        .bottom-nav .nav-btn .arrow { font-size: 18px; }

        /* Toolbar above nav */
        .toolbar {
            display: flex; gap: 8px; margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tool-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 14px; color: var(--text-secondary);
            cursor: pointer; transition: all .15s;
            font-family: inherit;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .tool-btn:hover { border-color: var(--primary-light); color: var(--primary-dark); }
        .tool-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tool-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .6; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(17,24,39,.45);
            display: none;
            align-items: flex-end; justify-content: center;
            animation: fadeIn .2s ease;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border-radius: 18px 18px 0 0;
            width: 100%; max-width: 760px;
            max-height: 85vh; overflow: hidden;
            display: flex; flex-direction: column;
            animation: slideUpModal .25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            padding: 16px 18px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close {
            background: #f3f4f6; border: none; width: 32px; height: 32px;
            border-radius: 50%; font-size: 18px; color: var(--muted);
            cursor: pointer; line-height: 1;
        }
        .modal-body { padding: 16px 18px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat-card {
            background: #f9fafb; border-radius: 12px; padding: 16px;
            text-align: center;
        }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--primary-dark); }
        .stat-value.green { color: var(--correct); }
        .stat-value.red { color: var(--wrong); }
        .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .stat-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
        .stat-actions .tool-btn { flex: 1; justify-content: center; min-width: 120px; }

        /* Question grid (jump) */
        .q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
        .q-cell {
            aspect-ratio: 1; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all .12s;
            background: #f3f4f6; color: var(--text-secondary);
            border: 2px solid transparent;
        }
        .q-cell:hover { transform: scale(1.06); }
        .q-cell.current { border-color: var(--primary); }
        .q-cell.answered-correct { background: var(--correct); color: #fff; }
        .q-cell.answered-wrong { background: var(--wrong); color: #fff; }
        .q-cell.answered { background: #e5e7eb; color: var(--text-secondary); }

        /* Filter tabs */
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-tab {
            background: #f3f4f6; border: none; border-radius: 20px;
            padding: 7px 14px; font-size: 13px; color: var(--text-secondary);
            cursor: pointer; font-family: inherit; transition: all .15s;
        }
        .filter-tab.active { background: var(--primary); color: #fff; }

        /* Toast */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(17,24,39,.92); color: #fff;
            padding: 10px 18px; border-radius: 22px;
            font-size: 14px; z-index: 200;
            opacity: 0; pointer-events: none;
            transition: opacity .2s, transform .2s;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

        /* Empty state */
        .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }

        /* Responsive */
        @media (min-width: 600px) {
            .main { padding: 24px 20px 110px; }
            .q-card { padding: 26px 24px; }
            .q-text { font-size: 19px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
            .modal { border-radius: 18px; }
            .modal-overlay { align-items: center; }
            .modal { max-height: 80vh; }
        }
        @media (min-width: 768px) {
            .bottom-nav { left: 50%; transform: translateX(-50%); width: 100%; max-width: 760px; border-radius: 14px 14px 0 0; }
        }

        /* Scrollbar */
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-row">
            <div class="topbar-title">B证项目负责人题库</div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="topbar-stats" id="quickStats">0/1000</span>
                <button class="icon-btn" id="statsBtn" title="统计与题号跳转" aria-label="统计">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></svg>
                </button>
            </div>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text">
                <span id="progressLabel">进度 0%</span>
                <span id="accuracyLabel">正确率 —</span>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="toolbar">
            <button class="tool-btn" id="filterAll"><span class="dot"></span>全部</button>
            <button class="tool-btn" id="filterUnanswered">未答</button>
            <button class="tool-btn" id="filterWrong">错题</button>
            <button class="tool-btn" id="shuffleBtn">&#x1F500; 乱序</button>
        </div>

        <div class="q-card" id="qCard">
            <div class="q-meta">
                <span class="q-badge" id="qBadge">第 1 题</span>
                <span class="q-type-tag" id="qTypeTag">单选题</span>
            </div>
            <div class="q-text" id="qText">加载中…</div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="prevBtn"><span class="arrow">&lsaquo;</span> 上一题</button>
        <button class="nav-btn primary" id="nextBtn">下一题 <span class="arrow">&rsaquo;</span></button>
    </div>

    <!-- Stats & Jump Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">统计与题号跳转</div>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总题数</div></div>
                    <div class="stat-card"><div class="stat-value green" id="statCorrect">0</div><div class="stat-label">答对</div></div>
                    <div class="stat-card"><div class="stat-value red" id="statWrong">0</div><div class="stat-label">答错</div></div>
                    <div class="stat-card"><div class="stat-value" id="statUnanswered">0</div><div class="stat-label">未答</div></div>
                </div>
                <div style="margin-bottom:6px; font-size:14px; color:var(--muted);">正确率：<b id="statAcc" style="color:var(--primary-dark)">—</b></div>
                <div class="stat-actions">
                    <button class="tool-btn" id="jumpUnanswered">跳到未答</button>
                    <button class="tool-btn" id="jumpWrong">跳到错题</button>
                    <button class="tool-btn" id="resetBtn" style="color:var(--wrong); border-color:#fecaca;">重置进度</button>
                </div>
                <hr style="margin:18px 0; border:none; border-top:1px solid var(--border);">
                <div class="filter-tabs" id="jumpFilter">
                    <button class="filter-tab active" data-filter="all">全部</button>
                    <button class="filter-tab" data-filter="unanswered">未答</button>
                    <button class="filter-tab" data-filter="wrong">错题</button>
                    <button class="filter-tab" data-filter="correct">对题</button>
                </div>
                <div class="q-grid" id="qGrid"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="questions-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
